{% extends "layout.html" %}
{% block content %}
    <div class="content-section">
        <form method="POST" action="">
            <!-- Since this is a classic form, we're not using form.hidden_tag() -->
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Reset Your Password</legend>
                <p>Enter your new password below.</p>
                <div class="form-group">
                    <label for="password" class="form-control-label">Password</label>
                    <input type="password" class="form-control form-control-lg" name="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-control-label">Confirm Password</label>
                    <input type="password" class="form-control form-control-lg" name="confirm_password" id="confirm_password" required>
                </div>
            </fieldset>
            <div class="form-group">
                <input type="submit" class="btn btn-outline-info" value="Reset Password">
            </div>
        </form>
    </div>
{% endblock content %}
